name: Build Extensions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Extension Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' chromium/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building goatEQ v$VERSION"

      - name: Install dependencies and build CSS
        run: |
          npm ci
          npm run build:css

      - name: Build Chromium Extension (.zip)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist
          tmpdir=$(mktemp -d)
          cp chromium/*.json chromium/*.js chromium/*.html chromium/*.css chromium/*.png "$tmpdir/" 2>/dev/null
          cd "$tmpdir" && zip -r "$GITHUB_WORKSPACE/dist/goatEQ-v${VERSION}-chrome.zip" . && cd "$GITHUB_WORKSPACE"
          rm -rf "$tmpdir"

      - name: Build Edge Extension (.zip)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist
          tmpdir=$(mktemp -d)
          cp edge/*.json edge/*.js edge/*.html edge/*.css edge/*.png "$tmpdir/" 2>/dev/null
          cd "$tmpdir" && zip -r "$GITHUB_WORKSPACE/dist/goatEQ-v${VERSION}-edge.zip" . && cd "$GITHUB_WORKSPACE"
          rm -rf "$tmpdir"

      - name: Build Firefox Extension (.xpi)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist
          tmpdir=$(mktemp -d)
          cp firefox/*.json firefox/*.js firefox/*.html firefox/*.css firefox/*.png "$tmpdir/" 2>/dev/null
          cd "$tmpdir" && zip -r "$GITHUB_WORKSPACE/dist/goatEQ-v${VERSION}-firefox.xpi" . && cd "$GITHUB_WORKSPACE"
          rm -rf "$tmpdir"

      - name: List build artifacts
        run: ls -lh dist/

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: goatEQ-chrome
          path: dist/*-chrome.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: goatEQ-firefox
          path: dist/*-firefox.xpi

      - name: Upload Edge artifact
        uses: actions/upload-artifact@v4
        with:
          name: goatEQ-edge
          path: dist/*-edge.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "goatEQ v${{ steps.version.outputs.version }}"
          body: |
            ## goatEQ v${{ steps.version.outputs.version }}

            **Gain Optimization & Audio Treatment** for your browser.

            ### Downloads
            | Browser | File | Install |
            |---------|------|---------|
            | 🟢 Chrome | `goatEQ-*-chrome.zip` | Unzip → `chrome://extensions/` → Load unpacked |
            | 🔵 Edge | `goatEQ-*-edge.zip` | Unzip → `edge://extensions/` → Load unpacked |
            | 🟠 Firefox | `goatEQ-*-firefox.xpi` | Drag into Firefox or `about:addons` → Install from file |
          files: dist/*
          generate_release_notes: true
