name: Verify and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify:
    name: Test, build and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build and package browser extensions
        run: npm run package:all

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: goatEQ-chrome
          path: artifacts/*-chrome.zip
          if-no-files-found: error

      - name: Upload Firefox compatibility package
        uses: actions/upload-artifact@v4
        with:
          name: goatEQ-firefox
          path: artifacts/*-firefox.zip
          if-no-files-found: error

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: goatEQ-source
          path: artifacts/*-source.zip
          if-no-files-found: error
